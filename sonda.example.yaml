# Sonda server configuration. Copy to sonda.yaml and adjust.
# ${NAME} references environment variables; they are allowed only in source URLs,
# credentials, account IDs, role ARNs, headers and the admin token. Validate with: sonda-server check -c sonda.yaml

server:
  listen: ":8080"
  # Identities, audit log and result handles. A SQLite file path, or a Postgres URL such as
  # postgres://sonda@db:5432/sonda with the password in the PGPASSWORD environment variable.
  database: sonda.db

# Enables the admin UI at /admin, where agent identities and their tokens are managed.
# Generate the token with: openssl rand -hex 32
admin:
  token: "${SONDA_ADMIN_TOKEN}"

# Optional. Used only to build Explore links in responses; Sonda never queries Grafana.
grafana:
  url: https://grafana.example.com

sources:
  sentry:
    type: sentry
    url: https://sentry.io # EU organizations: https://de.sentry.io
    org: acme
    # Use an internal integration token with org:read, project:read, event:read, project:releases.
    auth: { type: bearer, token: "${SENTRY_TOKEN}" }

  loki-prod:
    type: loki
    url: http://loki-gateway.monitoring.svc:3100
    headers: { X-Scope-OrgID: prod } # multi-tenant Loki only
    grafana_datasource_uid: loki-prod

  prom-prod:
    type: prometheus # also Mimir, Thanos, VictoriaMetrics, Grafana Cloud
    url: https://prometheus-prod-01-eu-west-0.grafana.net/api/prom
    auth: { type: basic, username: "123456", password: "${GRAFANA_CLOUD_METRICS_TOKEN}" }
    grafana_datasource_uid: prom-prod

  # Grafana Tempo serves the traces capability.
  # tempo-prod:
  #   type: tempo
  #   url: http://tempo.monitoring.svc:3200
  #   headers: { X-Scope-OrgID: prod } # multi-tenant Tempo only
  #   grafana_datasource_uid: tempo-prod

  # Cloudflare serves Workers logs, metrics and traces. The url defaults to
  # https://api.cloudflare.com/client/v4; the auth must be a bearer API token.
  # cloudflare:
  #   type: cloudflare
  #   account_id: "${CF_ACCOUNT_ID}"
  #   auth: { type: bearer, token: "${CF_API_TOKEN}" }

  # AWS serves CloudWatch Logs Insights and CloudWatch metrics. Credentials come from the
  # default AWS credential chain (IRSA, environment, profile), or from assuming role_arn.
  # aws-prod:
  #   type: aws
  #   region: eu-west-1
  #   role_arn: "${SONDA_AWS_ROLE_ARN}" # optional
  #   external_id: sonda # optional, only with role_arn
  #   max_scan_bytes: 10GB # Logs Insights is billed by scanned bytes; larger queries stop

  # Kubernetes serves pods, rollouts and events (the workloads capability). Without a url,
  # Sonda uses the service account of its own pod. Give the account only get and list on
  # pods, events and apps/replicasets in the bound namespaces.
  # k8s-prod:
  #   type: kubernetes
  #   url: https://ABC123.gr7.eu-west-1.eks.amazonaws.com
  #   auth: { type: bearer, token: "${K8S_TOKEN}" }
  #   ca_file: /etc/sonda/k8s-prod-ca.crt

services:
  engine-api:
    description: GraphQL API of the content engine
    repository: github.com/acme/engine
    environments:
      production:
        errors: { source: sentry, project: engine, environment: production }
        # The selector is a security boundary: every log and metric query of this
        # service gets these matchers. It must contain an = or =~ matcher that rejects
        # the empty value.
        logs: { source: loki-prod, selector: '{app="engine", namespace="prod"}' }
        metrics: { source: prom-prod, selector: '{job="engine", namespace="prod"}' }
        # traces: { source: tempo-prod, service: engine-api } # resource.service.name
        # Exact labels of the service's pods and ReplicaSets, in one namespace.
        # workloads: { source: k8s-prod, namespace: engine, labels: { app.kubernetes.io/name: engine-api } }
    # Named PromQL expressions without service matchers; Sonda adds the selector.
    signals:
      rps: sum(rate(http_requests_total[5m]))
      error_rate: sum(rate(http_requests_total{code=~"5.."}[5m])) / sum(rate(http_requests_total[5m]))
      p95_latency: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m])))

  # A Cloudflare Worker. Every query is restricted to the script.
  # web-worker:
  #   environments:
  #     production:
  #       logs: { source: cloudflare, script: web-worker }
  #       metrics:
  #         source: cloudflare
  #         script: web-worker
  #         # Optional account resources of the service, name -> ID. Their metrics are
  #         # labeled with the name. Durable Object namespace and queue IDs are 32 hex
  #         # characters, D1 IDs are UUIDs, R2 takes the bucket name.
  #         durable_object_namespaces: { sessions: 0123456789abcdef0123456789abcdef }
  #         d1_databases: { main: 6f1c2b9e-3d4a-4e5f-8a7b-0c1d2e3f4a5b }
  #         queues: { emails: fedcba9876543210fedcba9876543210 }
  #         r2_buckets: { uploads: web-uploads }
  #       traces: { source: cloudflare, script: web-worker }
  #   # With Cloudflare metrics, a signal is a mapping: a metric from the catalog
  #   # (requests, errors, cpu_time_p99, duration_p99, …, do_errors, d1_query_time_p99,
  #   # queue_backlog_messages, r2_requests, …) and optional dimensions to group by.
  #   # A signal of a resource metric needs that resource kind in every environment.
  #   signals:
  #     errors: { metric: errors, by: [status] }
  #     backlog: { metric: queue_backlog_messages }

  # An AWS-managed database. Logs come from exact log group names (1 to 50, no patterns);
  # metrics from one namespace, restricted by at least one dimension.
  # engine-db:
  #   environments:
  #     production:
  #       logs: { source: aws-prod, log_groups: [/aws/rds/cluster/engine/postgresql] }
  #       metrics: { source: aws-prod, namespace: AWS/RDS, dimensions: { DBClusterIdentifier: engine } }
  #   # With CloudWatch metrics, a signal is a mapping with a metric name and a statistic.
  #   signals:
  #     cpu: { metric: CPUUtilization, stat: Average }

# Server defaults; each identity can override them in the admin UI.
limits:
  max_range: 7d
  max_log_lines: 500
  max_response_bytes: 65536
  query_timeout: 30s
  concurrent_queries: 4
  requests_per_minute: 60

# Extra regular expressions to redact from log lines and error messages, on top of the
# built-in rules for bearer tokens, URL credentials, AWS keys, JWTs and password fields.
redact:
  - 'cust_[0-9a-f]{24}'
