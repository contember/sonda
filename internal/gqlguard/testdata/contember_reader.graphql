type _Column implements _Field {
  name: String!
  type: String!
  enumName: String
  defaultValue: Json
  nullable: Boolean!
  rules: [_Rule!]!
  validators: [_Validator!]!
}

interface _Field {
  name: String!
  type: String!
  nullable: Boolean
  rules: [_Rule!]!
  validators: [_Validator!]!
}

type _Rule {
  message: _RuleMessage
  validator: Int!
}

type _RuleMessage {
  text: String
}

type _Validator {
  operation: String!
  arguments: [_Argument!]!
}

union _Argument = _ValidatorArgument | _PathArgument | _LiteralArgument

type _ValidatorArgument {
  validator: Int!
}

type _PathArgument {
  path: [String!]!
}

type _LiteralArgument {
  value: Json
}

"""JSON custom scalar type"""
scalar Json

type _Relation implements _Field {
  name: String!
  type: String!
  side: _RelationSide!
  targetEntity: String!
  ownedBy: String
  inversedBy: String
  nullable: Boolean
  onDelete: _OnDeleteBehaviour
  orphanRemoval: Boolean
  orderBy: [_OrderBy!]
  rules: [_Rule!]!
  validators: [_Validator!]!
}

enum _RelationSide {
  owning
  inverse
}

enum _OnDeleteBehaviour {
  restrict
  cascade
  setNull
}

type _OrderBy {
  path: [String!]!
  direction: _OrderByDirection!
}

enum _OrderByDirection {
  asc
  desc
}

type Query {
  schema: _Schema
  getAuthor(by: AuthorUniqueWhere!, filter: AuthorWhere): Author
  listAuthor(filter: AuthorWhere, orderBy: [AuthorOrderBy!], offset: Int, limit: Int): [Author!]!
  paginateAuthor(filter: AuthorWhere, orderBy: [AuthorOrderBy!], skip: Int, first: Int): AuthorConnection!
  getArticle(by: ArticleUniqueWhere!, filter: ArticleWhere): Article
  listArticle(filter: ArticleWhere, orderBy: [ArticleOrderBy!], offset: Int, limit: Int): [Article!]!
  paginateArticle(filter: ArticleWhere, orderBy: [ArticleOrderBy!], skip: Int, first: Int): ArticleConnection!
  getTag(by: TagUniqueWhere!, filter: TagWhere): Tag
  listTag(filter: TagWhere, orderBy: [TagOrderBy!], offset: Int, limit: Int): [Tag!]!
  paginateTag(filter: TagWhere, orderBy: [TagOrderBy!], skip: Int, first: Int): TagConnection!
  transaction: QueryTransaction
  _info: Info
}

type _Schema {
  enums: [_Enum!]!
  entities: [_Entity!]!
}

type _Enum {
  name: String!
  values: [String!]!
}

type _Entity {
  name: String!
  customPrimaryAllowed: Boolean!
  fields: [_Field!]!
  unique: [_UniqueConstraint!]!
}

type _UniqueConstraint {
  fields: [String!]!
}

type Author {
  _meta: AuthorMeta
  id: UUID!
  name: String!
  email: String!
  articles(filter: ArticleWhere, orderBy: [ArticleOrderBy!], offset: Int, limit: Int): [Article!]!
  articlesBy(by: ArticlesOfAuthorByUniqueWhere!, filter: ArticleWhere): Article
  paginateArticles(filter: ArticleWhere, orderBy: [ArticleOrderBy!], skip: Int, first: Int): ArticleConnection!
}

type AuthorMeta {
  id: FieldMeta
  name: FieldMeta
  email: FieldMeta
  articles: FieldMeta
}

type FieldMeta {
  readable: Boolean
  updatable: Boolean
}

scalar UUID

type Article {
  _meta: ArticleMeta
  id: UUID!
  title: String!
  published: Boolean!
  status: ArticleStatus!
  secretNote: String
  author(filter: AuthorWhere): Author
  tags(filter: TagWhere, orderBy: [TagOrderBy!], offset: Int, limit: Int): [Tag!]!
  paginateTags(filter: TagWhere, orderBy: [TagOrderBy!], skip: Int, first: Int): TagConnection!
}

type ArticleMeta {
  id: FieldMeta
  title: FieldMeta
  published: FieldMeta
  status: FieldMeta
  secretNote: FieldMeta
  author: FieldMeta
  tags: FieldMeta
}

enum ArticleStatus {
  draft
  published
}

input AuthorWhere {
  id: UUIDCondition
  name: StringCondition
  email: StringCondition
  articles: ArticleWhere
  and: [AuthorWhere]
  or: [AuthorWhere]
  not: AuthorWhere
}

input UUIDCondition {
  and: [UUIDCondition!]
  or: [UUIDCondition!]
  not: UUIDCondition
  null: Boolean
  isNull: Boolean
  eq: UUID
  notEq: UUID
  in: [UUID!]
  notIn: [UUID!]
  lt: UUID
  lte: UUID
  gt: UUID
  gte: UUID
}

input StringCondition {
  and: [StringCondition!]
  or: [StringCondition!]
  not: StringCondition
  null: Boolean
  isNull: Boolean
  eq: String
  notEq: String
  in: [String!]
  notIn: [String!]
  lt: String
  lte: String
  gt: String
  gte: String
  contains: String
  startsWith: String
  endsWith: String
  containsCI: String
  startsWithCI: String
  endsWithCI: String
}

input ArticleWhere {
  id: UUIDCondition
  title: StringCondition
  published: BooleanCondition
  status: ArticleStatusEnumCondition
  secretNote: StringCondition
  author: AuthorWhere
  tags: TagWhere
  and: [ArticleWhere]
  or: [ArticleWhere]
  not: ArticleWhere
}

input BooleanCondition {
  and: [BooleanCondition!]
  or: [BooleanCondition!]
  not: BooleanCondition
  null: Boolean
  isNull: Boolean
  eq: Boolean
  notEq: Boolean
  in: [Boolean!]
  notIn: [Boolean!]
  lt: Boolean
  lte: Boolean
  gt: Boolean
  gte: Boolean
}

input ArticleStatusEnumCondition {
  and: [ArticleStatusEnumCondition!]
  or: [ArticleStatusEnumCondition!]
  not: ArticleStatusEnumCondition
  null: Boolean
  isNull: Boolean
  eq: ArticleStatus
  notEq: ArticleStatus
  in: [ArticleStatus!]
  notIn: [ArticleStatus!]
  lt: ArticleStatus
  lte: ArticleStatus
  gt: ArticleStatus
  gte: ArticleStatus
}

input TagWhere {
  id: UUIDCondition
  name: StringCondition
  articles: ArticleWhere
  and: [TagWhere]
  or: [TagWhere]
  not: TagWhere
}

type Tag {
  _meta: TagMeta
  id: UUID!
  name: String!
  articles(filter: ArticleWhere, orderBy: [ArticleOrderBy!], offset: Int, limit: Int): [Article!]!
  paginateArticles(filter: ArticleWhere, orderBy: [ArticleOrderBy!], skip: Int, first: Int): ArticleConnection!
}

type TagMeta {
  id: FieldMeta
  name: FieldMeta
  articles: FieldMeta
}

input ArticleOrderBy {
  _random: Boolean
  _randomSeeded: Int
  id: OrderDirection
  title: OrderDirection
  published: OrderDirection
  status: OrderDirection
  secretNote: OrderDirection
  author: AuthorOrderBy
}

enum OrderDirection {
  asc
  desc
  ascNullsFirst
  descNullsLast
}

input AuthorOrderBy {
  _random: Boolean
  _randomSeeded: Int
  id: OrderDirection
  name: OrderDirection
  email: OrderDirection
}

type ArticleConnection {
  pageInfo: PageInfo!
  edges: [ArticleEdge!]!
}

type PageInfo {
  totalCount: Int!
}

type ArticleEdge {
  node: Article!
}

input TagOrderBy {
  _random: Boolean
  _randomSeeded: Int
  id: OrderDirection
  name: OrderDirection
}

type TagConnection {
  pageInfo: PageInfo!
  edges: [TagEdge!]!
}

type TagEdge {
  node: Tag!
}

input ArticlesOfAuthorByUniqueWhere {
  id: UUID
}

input AuthorUniqueWhere {
  id: UUID
  email: String
  articles: ArticleUniqueWhere
}

input ArticleUniqueWhere {
  id: UUID
}

type AuthorConnection {
  pageInfo: PageInfo!
  edges: [AuthorEdge!]!
}

type AuthorEdge {
  node: Author!
}

input TagUniqueWhere {
  id: UUID
  name: String
}

type QueryTransaction {
  schema: _Schema
  getAuthor(by: AuthorUniqueWhere!, filter: AuthorWhere): Author
  listAuthor(filter: AuthorWhere, orderBy: [AuthorOrderBy!], offset: Int, limit: Int): [Author!]!
  paginateAuthor(filter: AuthorWhere, orderBy: [AuthorOrderBy!], skip: Int, first: Int): AuthorConnection!
  getArticle(by: ArticleUniqueWhere!, filter: ArticleWhere): Article
  listArticle(filter: ArticleWhere, orderBy: [ArticleOrderBy!], offset: Int, limit: Int): [Article!]!
  paginateArticle(filter: ArticleWhere, orderBy: [ArticleOrderBy!], skip: Int, first: Int): ArticleConnection!
  getTag(by: TagUniqueWhere!, filter: TagWhere): Tag
  listTag(filter: TagWhere, orderBy: [TagOrderBy!], offset: Int, limit: Int): [Tag!]!
  paginateTag(filter: TagWhere, orderBy: [TagOrderBy!], skip: Int, first: Int): TagConnection!
}

type Info {
  description: String
}
