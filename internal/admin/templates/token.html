{{define "content"}}
<section class="card">
  <div class="card-header"><h2 class="card-title">Copy the token now</h2></div>
  <div class="card-body">
    <p class="muted">Sonda stores only its hash and cannot show it again.</p>
    <pre class="token"><code id="token">{{.Token}}</code></pre>
    <div class="actions"><button type="button" class="button" onclick="navigator.clipboard.writeText(document.getElementById('token').textContent)">Copy token</button></div>
  </div>
</section>
<section class="card">
  <div class="card-header"><h2 class="card-title">Configure the agent</h2></div>
  <div class="card-body">
<pre class="code"><code>export SONDA_URL={{.URL}}
export SONDA_TOKEN={{.Token}}</code></pre>
  </div>
</section>
<p><a class="button button-secondary" href="/admin/identities">Back to identities</a></p>
{{end}}
