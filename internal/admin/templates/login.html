{{define "content"}}
<form class="form" method="post" action="/admin/login">
  <label class="field">
    <span class="field-label">Admin token</span>
    <input class="input" type="password" name="token" required autofocus autocomplete="current-password">
    <span class="field-hint">The value of <code>admin.token</code> in the server configuration.</span>
  </label>
  <button type="submit" class="button">Sign in</button>
</form>
{{end}}
