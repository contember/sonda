name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # The LogQL scoping tests check the lexer against a real Loki.
      loki:
        image: grafana/loki:3.5.5
        ports:
          - 3100:3100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - run: go build ./cmd/...

      - run: go test ./...
        env:
          SONDA_TEST_LOKI_URL: http://localhost:3100
