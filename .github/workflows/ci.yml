name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # The LogQL scoping tests check the lexer against a real Loki.
      loki:
        image: grafana/loki:3.5.5
        ports:
          - 3100:3100
      # The store tests run against SQLite and Postgres.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sonda
          POSTGRES_PASSWORD: sonda
          POSTGRES_DB: sonda
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sonda"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - run: go build ./cmd/...

      # The TraceQL scoping tests check the lexer against a real Tempo with seeded traces.
      # Tempo needs a config file, which a service container cannot mount before checkout.
      - name: Start and seed Tempo
        run: |
          docker compose -f dev/docker-compose.yml up -d tempo
          timeout 120 sh -c 'until curl -sf http://localhost:13200/ready; do sleep 2; done'
          dev/seed-traces.sh
          timeout 60 sh -c 'until curl -sfG --data-urlencode "q={ resource.service.name = \"svc-b\" }" http://localhost:13200/api/search | grep -q traceID; do sleep 2; done'

      - run: go test ./...
        env:
          SONDA_TEST_LOKI_URL: http://localhost:3100
          SONDA_TEST_TEMPO_URL: http://localhost:13200
          SONDA_TEST_POSTGRES_URL: postgres://sonda:sonda@localhost:5432/sonda
