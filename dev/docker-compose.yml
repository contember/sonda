# Local Loki, Prometheus, Tempo and Postgres for development. Seed traces with dev/seed-traces.sh.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "19090:9090"
  loki:
    image: grafana/loki:3.5.5
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "13100:3100"
  tempo:
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "13200:3200"
      - "14318:4318"
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: sonda
      POSTGRES_PASSWORD: sonda
      POSTGRES_DB: sonda
    ports:
      - "15432:5432"
